<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Implementasi Online</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- dom-to-image-more (Paling stabil di Android) -->
  <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

  <style>
    :root{ --b:#111; }
    body{ background:#f6f7fb; }

    .frame{ border:3px solid var(--b); background:#fff; border-radius:18px; }
    .grid{ border:3px solid var(--b); border-radius:18px; overflow:hidden; }

    /* FIX: jangan pakai CSS grid (kadang blank di Android capture), pakai flex row */
    .grid-row{ display:flex; width:100%; }

    .cell{
      width:25%;
      border-right:3px solid var(--b);
      border-bottom:3px solid var(--b);
      background:#fff;
      min-height:86px;
      cursor:pointer;
      user-select:none;
    }
    .grid-row .cell:last-child{ border-right:none !important; }

    .head{
      border-bottom:2px solid var(--b);
      font-weight:900;
      font-size:9px;
      text-align:center;
      padding:2px 1px;
      background:#fff;
    }

    .content{
      height: calc(100% - 24px);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2px;
      font-weight:900;
      font-size:9px;
      line-height:1.15;
    }

    .content img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:4px;
    }

    .tap-hint{
      width:28px;height:28px;
      border:1.5px solid #111;
      border-radius:9px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      opacity:.95;
    }
    .add-photo{ font-size:8px; font-weight:900; opacity:.75; margin-top:3px; }

    .logo-box{
      background:#fff;
      border:2px solid #111;
      border-radius:14px;
      padding:6px 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:110px;
      min-height:60px;
    }
    .logo-box img{ width:85px; height:auto; display:block; }

    /* Floating */
    .fab{
      position:fixed; right:12px; bottom:12px; z-index:9999;
      display:flex; flex-direction:column; gap:8px;
    }
    .fab .btn{ padding:8px 12px !important; font-size:12px !important; font-weight:900 !important;
      border-radius:14px !important; box-shadow:0 6px 18px rgba(0,0,0,.15);
    }

    /* mode simple */
    body.mode-ultra .cell{ min-height:86px; }
    body.mode-compact .cell{ min-height:125px; }
    body.mode-normal .cell{ min-height:170px; }

    body.mode-normal .head{ font-size:13px; padding:6px 4px; border-bottom-width:3px; }
    body.mode-normal .content{ height: calc(100% - 38px); padding:8px; font-size:14px; }
    body.mode-normal .tap-hint{ width:52px;height:52px;font-size:26px;border-radius:14px;border-width:2px; }
    body.mode-normal .add-photo{ font-size:12px;margin-top:8px; }
    body.mode-normal .content img{ border-radius:8px; }

    body.mode-compact .head{ font-size:11px; padding:4px 3px; border-bottom-width:2px; }
    body.mode-compact .content{ height: calc(100% - 30px); padding:5px; font-size:12px; }
    body.mode-compact .tap-hint{ width:42px;height:42px;font-size:22px;border-radius:12px;border-width:2px; }
    body.mode-compact .add-photo{ font-size:10px;margin-top:6px; }
    body.mode-compact .content img{ border-radius:6px; }

    /* IMPORTANT: Saat capture, matiin shadow biar ringan */
    .capture *{ box-shadow:none !important; }
  </style>
</head>

<body class="mode-ultra">
  <div class="container py-3">

    <!-- HOME -->
    <div id="pageHome" class="frame p-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
          <div class="h4 mb-0 fw-bold">Pilih Tugas</div>
          <small class="text-muted fw-semibold">Online (Firestore + Storage)</small>
        </div>
        <button id="btnAddTask" class="btn btn-dark fw-bold rounded-3">+ Tambah Tugas Baru</button>
      </div>

      <div id="addTaskForm" class="card border-dark rounded-4 mb-3 d-none">
        <div class="card-body">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-8">
              <input id="inpTaskName" type="text" class="form-control border-dark rounded-3"
                placeholder="Nama tugas (contoh: Full Display)"/>
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button id="btnSaveTask" class="btn btn-success fw-bold rounded-3">Simpan</button>
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button id="btnCancelTask" class="btn btn-outline-dark fw-bold rounded-3">Batal</button>
            </div>
          </div>
        </div>
      </div>

      <div id="taskList" class="vstack gap-2">
        <div class="text-muted fw-bold">Loading...</div>
      </div>
    </div>

    <!-- GRID -->
    <div id="pageGrid" class="frame p-3 d-none">
      <div id="reportArea">
        <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
          <div>
            <div class="h3 fw-bold mb-1">Photo Implementasi</div>
            <div class="fw-semibold">TUGAS : <span id="lblTask" class="fw-bold">-</span></div>
            <div class="fw-semibold">AC : <span id="lblAC" class="fw-bold">-</span></div>
            <div class="fw-semibold">TANGGAL : <span id="lblDate" class="fw-bold">-</span></div>
          </div>

          <div class="logo-box">
            <img src="alfamart-bersatu.png" alt="Alfamart Bersatu">
          </div>
        </div>

        <div class="mt-3 grid" id="grid"></div>
      </div>

      <div class="mt-3">
        <button id="btnBack" class="btn btn-outline-dark fw-bold rounded-3">← Kembali</button>
      </div>

      <input id="filePicker" type="file" accept="image/*" class="d-none"/>
    </div>
  </div>

  <!-- Floating -->
  <div class="fab d-none" id="fab">
    <button id="btnModeNormal" class="btn btn-outline-dark">Normal</button>
    <button id="btnModeCompact" class="btn btn-outline-dark">Compact</button>
    <button id="btnModeUltra"  class="btn btn-dark">Ultra</button>

    <button id="btnReset" class="btn btn-outline-danger">Reset</button>
    <button id="btnSendWA" class="btn btn-dark">Send WA (Image)</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getFirestore, collection, doc, getDocs, setDoc, addDoc, deleteDoc, updateDoc,
      onSnapshot, query, orderBy, serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdY1mTpiosbYwTIyBN95QLrTjk-jMZgN8",
      authDomain: "pencariandataft.firebaseapp.com",
      projectId: "pencariandataft",
      storageBucket: "pencariandataft.firebasestorage.app",
      messagingSenderId: "154970809034",
      appId: "1:154970809034:web:82b9c68566e21099230a33"
    };

    const DEFAULT_AC = "DIAN FAHMI SUGIAR";
    const RESET_USER = "admin";
    const RESET_PASS = "admin";

    const STORES = [
      { code:"1PQ7", label:"PRKE" }, { code:"1PI6", label:"SAND" }, { code:"1PW9", label:"IJSI" }, { code:"1P3V", label:"ZAFS" },
      { code:"1P4I", label:"RYND" }, { code:"1P5J", label:"RYIS" }, { code:"1P7Q", label:"PMKS" }, { code:"1PQ9", label:"LAKU" },
      { code:"1P5F", label:"BPNG" }, { code:"1PV7", label:"SGLR" }, { code:"1P4M", label:"SMDG" }, { code:"1P5I", label:"RAND" },
      { code:"1P5U", label:"RIBU" }, { code:"1P7O", label:"SGHL" }, { code:"1P6T", label:"RNTY" }, { code:"1PI7", label:"NATA" },
      { code:"1P9J", label:"BTGF" }
    ];

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const pageHome = document.getElementById("pageHome");
    const pageGrid = document.getElementById("pageGrid");
    const taskList = document.getElementById("taskList");
    const fab = document.getElementById("fab");

    const btnAddTask = document.getElementById("btnAddTask");
    const addTaskForm = document.getElementById("addTaskForm");
    const inpTaskName = document.getElementById("inpTaskName");
    const btnSaveTask = document.getElementById("btnSaveTask");
    const btnCancelTask = document.getElementById("btnCancelTask");

    const lblTask = document.getElementById("lblTask");
    const lblAC = document.getElementById("lblAC");
    const lblDate = document.getElementById("lblDate");

    const reportArea = document.getElementById("reportArea");
    const btnBack = document.getElementById("btnBack");
    const grid = document.getElementById("grid");
    const filePicker = document.getElementById("filePicker");

    const btnModeNormal = document.getElementById("btnModeNormal");
    const btnModeCompact = document.getElementById("btnModeCompact");
    const btnModeUltra  = document.getElementById("btnModeUltra");
    const btnReset = document.getElementById("btnReset");
    const btnSendWA = document.getElementById("btnSendWA");

    let currentTaskId=null;
    let currentStoreCode=null;
    let unsubPhotos=null;

    function today(){
      const d=new Date();
      const dd=String(d.getDate()).padStart(2,'0');
      const mm=String(d.getMonth()+1).padStart(2,'0');
      const yy=d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function setMode(m){
      document.body.classList.remove("mode-normal","mode-compact","mode-ultra");
      document.body.classList.add(`mode-${m}`);
      localStorage.setItem("gridMode",m);

      btnModeNormal.classList.remove("btn-dark");
      btnModeCompact.classList.remove("btn-dark");
      btnModeUltra.classList.remove("btn-dark");
      btnModeNormal.classList.add("btn-outline-dark");
      btnModeCompact.classList.add("btn-outline-dark");
      btnModeUltra.classList.add("btn-outline-dark");

      const act = m==="normal"?btnModeNormal:(m==="compact"?btnModeCompact:btnModeUltra);
      act.classList.add("btn-dark");
      act.classList.remove("btn-outline-dark");
    }
    btnModeNormal.onclick=()=>setMode("normal");
    btnModeCompact.onclick=()=>setMode("compact");
    btnModeUltra.onclick=()=>setMode("ultra");
    setMode(localStorage.getItem("gridMode")||"ultra");

    function buildGrid(photoMap){
      grid.innerHTML="";
      for(let i=0;i<STORES.length;i+=4){
        const row=document.createElement("div");
        row.className="grid-row";

        const chunk=STORES.slice(i,i+4);
        chunk.forEach(store=>{
          const url=photoMap[store.code];
          const cell=document.createElement("div");
          cell.className="cell";
          cell.innerHTML=`
            <div class="head">${store.code} ${store.label}</div>
            <div class="content">
              ${url?`<img src="${url}" crossorigin="anonymous">`
              :`<div><div class="tap-hint">📷</div><div class="add-photo">Add Photo</div></div>`}
            </div>
          `;
          cell.onclick=()=>{
            currentStoreCode=store.code;
            filePicker.value="";
            filePicker.click();
          };
          row.appendChild(cell);
        });

        while(row.children.length<4){
          const b=document.createElement("div");
          b.className="cell";
          b.innerHTML=`<div class="head">&nbsp;</div><div class="content">&nbsp;</div>`;
          row.appendChild(b);
        }
        grid.appendChild(row);
      }
    }

    async function resetTaskPhotos(taskId){
      const photosRef=collection(db,"tasks",taskId,"photos");
      const snap=await getDocs(photosRef);
      const batch=writeBatch(db);
      snap.docs.forEach(d=>batch.delete(d.ref));
      await batch.commit();

      for(const s of STORES){
        const fref=ref(storage,`photos/${taskId}/${s.code}.jpg`);
        await deleteObject(fref).catch(()=>{});
      }
    }

    async function openTask(taskId){
      currentTaskId=taskId;

      const all=await getDocs(query(collection(db,"tasks")));
      const tdoc=all.docs.find(d=>d.id===taskId);
      if(!tdoc) return;

      const taskRef=doc(db,"tasks",taskId);
      const task={id:tdoc.id,...tdoc.data()};

      const tdy=today();
      const lastDate=task.date||"";
      if(lastDate!==tdy){
        await resetTaskPhotos(taskId);
        await updateDoc(taskRef,{date:tdy});
        task.date=tdy;
      }

      lblTask.textContent=task.name;
      lblAC.textContent=task.ac||DEFAULT_AC;
      lblDate.textContent=task.date||tdy;

      pageHome.classList.add("d-none");
      pageGrid.classList.remove("d-none");
      fab.classList.remove("d-none");

      buildGrid({});

      const photosRef=collection(db,"tasks",taskId,"photos");
      if(unsubPhotos) unsubPhotos();
      unsubPhotos=onSnapshot(photosRef,(snap)=>{
        const map={};
        snap.docs.forEach(d=>map[d.id]=d.data().url);
        buildGrid(map);
      });
    }

    // ✅ Capture pake dom-to-image-more (FIX blank)
    btnSendWA.onclick = async ()=>{
      try{
        btnSendWA.disabled=true;
        btnSendWA.textContent="Processing...";

        fab.classList.add("d-none");
        reportArea.classList.add("capture");
        await new Promise(r=>setTimeout(r,150));

        const dataUrl = await domtoimage.toPng(reportArea, {
          quality: 1,
          bgcolor: "#ffffff",
          cacheBust: true
        });

        reportArea.classList.remove("capture");
        fab.classList.remove("d-none");

        const a=document.createElement("a");
        a.href=dataUrl;
        a.download=`photo-implementasi-${today().replaceAll('/','-')}.png`;
        a.click();

        alert("✅ Gambar sudah di-download.\nBuka Download lalu Share ke WhatsApp.");
      }catch(e){
        console.error(e);
        reportArea.classList.remove("capture");
        fab.classList.remove("d-none");
        alert("Gagal buat image ❌");
      }finally{
        btnSendWA.disabled=false;
        btnSendWA.textContent="Send WA (Image)";
      }
    };

    btnAddTask.onclick=()=>{
      addTaskForm.classList.remove("d-none");
      inpTaskName.value="";
      inpTaskName.focus();
    };
    btnCancelTask.onclick=()=>add

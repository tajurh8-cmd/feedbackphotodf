<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Implementasi Online</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Firebase COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>

  <style>
    :root{ --b:#111; --cellH: 86px; }
    body{ background:#f6f7fb; }

    .frame{ border:3px solid var(--b); background:#fff; border-radius:18px; }
    .grid{ border:3px solid var(--b); border-radius:18px; overflow:hidden; }

    .grid-row{ display:flex; width:100%; align-items:stretch; }
    .cell{
      flex:1; min-width:0;
      border-right:3px solid var(--b);
      border-bottom:3px solid var(--b);
      background:#fff;
      cursor:pointer;
      user-select:none;
      min-height: var(--cellH);
    }
    .grid-row .cell:last-child{ border-right:none !important; }

    .head{
      border-bottom:2px solid var(--b);
      font-weight:900;
      font-size:9px;
      text-align:center;
      padding:2px 1px;
      background:#fff;
    }

    .content{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2px;
      font-weight:900;
      line-height:1.15;
      height: calc(var(--cellH) - 24px);
    }

    .content img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:4px;
    }

    .tap-hint{
      width:28px;height:28px;
      border:1.5px solid #111;
      border-radius:9px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      opacity:.95;
    }
    .add-photo{
      font-size:8px;
      font-weight:900;
      opacity:.75;
      margin-top:3px;
    }

    .logo-box{
      background:#fff;
      border:2px solid #111;
      border-radius:14px;
      padding:6px 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:105px;
      min-height:58px;
    }
    .logo-box img{ width:82px; height:auto; display:block; }

    /* Floating */
    .fab{
      position:fixed;
      right:12px;
      bottom:12px;
      z-index:9999;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .fab .btn{
      padding:8px 12px !important;
      font-size:12px !important;
      font-weight:900 !important;
      border-radius:14px !important;
      box-shadow:0 6px 18px rgba(0,0,0,.15);
    }

    /* modes */
    body.mode-ultra { --cellH: 86px; }
    body.mode-compact{ --cellH: 125px; }
    body.mode-normal { --cellH: 170px; }

    body.mode-compact .head{ font-size:11px; padding:4px 3px; border-bottom-width:2px; }
    body.mode-normal  .head{ font-size:13px; padding:6px 4px; border-bottom-width:3px; }

    body.mode-compact .content{ height: calc(125px - 30px); padding:5px; }
    body.mode-normal  .content{ height: calc(170px - 38px); padding:8px; }

    body.mode-compact .tap-hint{ width:42px;height:42px;font-size:22px;border-radius:12px;border-width:2px; }
    body.mode-normal  .tap-hint{ width:52px;height:52px;font-size:26px;border-radius:14px;border-width:2px; }

    body.mode-compact .add-photo{ font-size:10px;margin-top:6px; }
    body.mode-normal  .add-photo{ font-size:12px;margin-top:8px; }

    body.mode-compact .content img{ border-radius:6px; }
    body.mode-normal  .content img{ border-radius:8px; }
  </style>
</head>

<body class="mode-ultra">
  <div class="container py-3">

    <!-- HOME -->
    <div id="pageHome" class="frame p-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div>
          <div class="h4 mb-0 fw-bold">Pilih Tugas</div>
          <small class="text-muted fw-semibold">Online (Firestore + Storage)</small>
        </div>
        <button id="btnAddTask" class="btn btn-dark fw-bold rounded-3">+ Tambah Tugas Baru</button>
      </div>

      <div id="addTaskForm" class="card border-dark rounded-4 mb-3 d-none">
        <div class="card-body">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-8">
              <input id="inpTaskName" type="text" class="form-control border-dark rounded-3"
                placeholder="Nama tugas (contoh: Full Display)"/>
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button id="btnSaveTask" class="btn btn-success fw-bold rounded-3">Simpan</button>
            </div>
            <div class="col-6 col-md-2 d-grid">
              <button id="btnCancelTask" class="btn btn-outline-dark fw-bold rounded-3">Batal</button>
            </div>
          </div>
        </div>
      </div>

      <div id="taskList" class="vstack gap-2">
        <div class="text-muted fw-bold">Loading...</div>
      </div>
    </div>

    <!-- GRID -->
    <div id="pageGrid" class="frame p-3 d-none">
      <!-- CAPTURE AREA ONLY -->
      <div id="reportArea">
        <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
          <div>
            <div class="h3 fw-bold mb-1">Photo Implementasi</div>
            <div class="fw-semibold">TUGAS : <span id="lblTask" class="fw-bold">-</span></div>
            <div class="fw-semibold">AC : <span id="lblAC" class="fw-bold">-</span></div>
            <div class="fw-semibold">TANGGAL : <span id="lblDate" class="fw-bold">-</span></div>
          </div>

          <div class="logo-box">
            <img src="alfamart-bersatu.png" alt="Alfamart Bersatu">
          </div>
        </div>

        <div class="mt-3 grid" id="grid"></div>
      </div>

      <div class="mt-3">
        <button id="btnBack" class="btn btn-outline-dark fw-bold rounded-3">← Kembali</button>
      </div>

      <input id="filePicker" type="file" accept="image/*" class="d-none"/>
    </div>
  </div>

  <!-- Floating Buttons -->
  <div class="fab d-none" id="fab">
    <button id="btnModeNormal" class="btn btn-outline-dark">Normal</button>
    <button id="btnModeCompact" class="btn btn-outline-dark">Compact</button>
    <button id="btnModeUltra" class="btn btn-dark">Ultra</button>
    <button id="btnReset" class="btn btn-outline-danger">Reset</button>
    <button id="btnSendWA" class="btn btn-dark">Send WA (Image)</button>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================
    const firebaseConfig = {
      apiKey: "AIzaSyBdY1mTpiosbYwTIyBN95QLrTjk-jMZgN8",
      authDomain: "pencariandataft.firebaseapp.com",
      projectId: "pencariandataft",
      storageBucket: "pencariandataft.firebasestorage.app",
      messagingSenderId: "154970809034",
      appId: "1:154970809034:web:82b9c68566e21099230a33"
    };

    const DEFAULT_AC = "DIAN FAHMI SUGIAR";
    const RESET_USER = "admin";
    const RESET_PASS = "admin";

    const STORES = [
      { code:"1PQ7", label:"PRKE" }, { code:"1PI6", label:"SAND" }, { code:"1PW9", label:"IJSI" }, { code:"1P3V", label:"ZAFS" },
      { code:"1P4I", label:"RYND" }, { code:"1P5J", label:"RYIS" }, { code:"1P7Q", label:"PMKS" }, { code:"1PQ9", label:"LAKU" },
      { code:"1P5F", label:"BPNG" }, { code:"1PV7", label:"SGLR" }, { code:"1P4M", label:"SMDG" }, { code:"1P5I", label:"RAND" },
      { code:"1P5U", label:"RIBU" }, { code:"1P7O", label:"SGHL" }, { code:"1P6T", label:"RNTY" }, { code:"1PI7", label:"NATA" },
      { code:"1P9J", label:"BTGF" }
    ];

    // =========================
    // INIT FIREBASE
    // =========================
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // =========================
    // IDB CACHE (ANTI BLANK)
    // =========================
    const IDB_NAME = "photoImplementasiDB";
    const IDB_STORE = "images";

    function idbOpen(){
      return new Promise((resolve, reject)=>{
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e)=>{
          const dbi=e.target.result;
          if(!dbi.objectStoreNames.contains(IDB_STORE)) dbi.createObjectStore(IDB_STORE);
        };
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    }
    async function idbSet(key, blob){
      const dbi=await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx=dbi.transaction(IDB_STORE,"readwrite");
        tx.objectStore(IDB_STORE).put(blob,key);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>reject(tx.error);
      });
    }
    async function idbGet(key){
      const dbi=await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx=dbi.transaction(IDB_STORE,"readonly");
        const req=tx.objectStore(IDB_STORE).get(key);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error);
      });
    }
    async function idbDel(key){
      const dbi=await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx=dbi.transaction(IDB_STORE,"readwrite");
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>reject(tx.error);
      });
    }

    function cacheKey(taskId, storeCode){ return `task:${taskId}:store:${storeCode}`; }

    async function storageGetBlob(taskId, storeCode){
      const ref = storage.ref(`photos/${taskId}/${storeCode}.jpg`);
      return await ref.getBlob(); // ✅ NO CORS
    }

    async function getLocalImageURL(taskId, storeCode){
      const blob = await idbGet(cacheKey(taskId, storeCode));
      if(!blob) return null;
      return URL.createObjectURL(blob);
    }

    async function waitImagesReady(rootEl){
      const imgs = Array.from(rootEl.querySelectorAll("img"));
      await Promise.all(imgs.map(async (img)=>{
        try{
          if(!img.complete){
            await new Promise(res=>{
              img.onload=()=>res();
              img.onerror=()=>res();
            });
          }
          if(img.decode) await img.decode().catch(()=>{});
        }catch(e){}
      }));
    }

    // =========================
    // UI VARS
    // =========================
    const pageHome = document.getElementById("pageHome");
    const pageGrid = document.getElementById("pageGrid");
    const taskList = document.getElementById("taskList");
    const fab = document.getElementById("fab");

    const btnAddTask = document.getElementById("btnAddTask");
    const addTaskForm = document.getElementById("addTaskForm");
    const inpTaskName = document.getElementById("inpTaskName");
    const btnSaveTask = document.getElementById("btnSaveTask");
    const btnCancelTask = document.getElementById("btnCancelTask");

    const lblTask = document.getElementById("lblTask");
    const lblAC = document.getElementById("lblAC");
    const lblDate = document.getElementById("lblDate");

    const reportArea = document.getElementById("reportArea");
    const btnBack = document.getElementById("btnBack");
    const grid = document.getElementById("grid");
    const filePicker = document.getElementById("filePicker");

    const btnModeNormal = document.getElementById("btnModeNormal");
    const btnModeCompact = document.getElementById("btnModeCompact");
    const btnModeUltra  = document.getElementById("btnModeUltra");
    const btnReset = document.getElementById("btnReset");
    const btnSendWA = document.getElementById("btnSendWA");

    let currentTaskId=null;
    let currentStoreCode=null;
    let unsubPhotos=null;

    // =========================
    // HELPERS
    // =========================
    function today(){
      const d=new Date();
      const dd=String(d.getDate()).padStart(2,'0');
      const mm=String(d.getMonth()+1).padStart(2,'0');
      const yy=d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function setMode(m){
      document.body.classList.remove("mode-normal","mode-compact","mode-ultra");
      document.body.classList.add(`mode-${m}`);
      localStorage.setItem("gridMode",m);

      [btnModeNormal,btnModeCompact,btnModeUltra].forEach(b=>{
        b.classList.remove("btn-dark");
        b.classList.add("btn-outline-dark");
      });
      const act = m==="normal"?btnModeNormal:(m==="compact"?btnModeCompact:btnModeUltra);
      act.classList.add("btn-dark");
      act.classList.remove("btn-outline-dark");
    }
    setMode(localStorage.getItem("gridMode") || "ultra");
    btnModeNormal.onclick=()=>setMode("normal");
    btnModeCompact.onclick=()=>setMode("compact");
    btnModeUltra.onclick =()=>setMode("ultra");

    // =========================
    // GRID BUILDER
    // =========================
    async function buildGrid(photoMap){
      grid.innerHTML="";

      for(let i=0;i<STORES.length;i+=4){
        const row=document.createElement("div");
        row.className="grid-row";

        const chunk=STORES.slice(i,i+4);

        for(const store of chunk){
          const remoteURL = photoMap[store.code] || null;

          const cell=document.createElement("div");
          cell.className="cell";

          const head=document.createElement("div");
          head.className="head";
          head.textContent=`${store.code} ${store.label}`;

          const content=document.createElement("div");
          content.className="content";

          // local blob first
          let localURL = null;
          if(currentTaskId) localURL = await getLocalImageURL(currentTaskId, store.code);

          if(localURL){
            const img=document.createElement("img");
            img.src=localURL;
            content.appendChild(img);
          } else if(remoteURL){
            const img=document.createElement("img");
            img.src=remoteURL;
            content.appendChild(img);

            // cache via storage sdk
            (async ()=>{
              try{
                const key=cacheKey(currentTaskId, store.code);
                const cached=await idbGet(key);
                if(!cached){
                  const blob=await storageGetBlob(currentTaskId, store.code);
                  await idbSet(key, blob);
                }
              }catch(e){}
            })();
          } else {
            content.innerHTML=`<div><div class="tap-hint">📷</div><div class="add-photo">Add Photo</div></div>`;
          }

          cell.appendChild(head);
          cell.appendChild(content);

          cell.onclick=()=>{
            currentStoreCode=store.code;
            filePicker.value="";
            filePicker.click();
          };

          row.appendChild(cell);
        }

        while(row.children.length<4){
          const blank=document.createElement("div");
          blank.className="cell";
          blank.innerHTML=`<div class="head">&nbsp;</div><div class="content">&nbsp;</div>`;
          row.appendChild(blank);
        }

        grid.appendChild(row);
      }
    }

    // =========================
    // RESET
    // =========================
    async function resetTaskPhotos(taskId){
      const photosRef = db.collection("tasks").doc(taskId).collection("photos");
      const snap = await photosRef.get();

      const batch=db.batch();
      snap.forEach(d=>batch.delete(d.ref));
      await batch.commit();

      for(const s of STORES){
        await storage.ref(`photos/${taskId}/${s.code}.jpg`).delete().catch(()=>{});
      }
      for(const s of STORES){
        await idbDel(cacheKey(taskId, s.code)).catch(()=>{});
      }
    }

    // =========================
    // OPEN TASK + DAILY RESET
    // =========================
    async function openTask(taskId){
      currentTaskId=taskId;

      const tdoc=await db.collection("tasks").doc(taskId).get();
      if(!tdoc.exists) return;

      const task=tdoc.data();
      const tdy=today();

      if((task.date||"")!==tdy){
        await resetTaskPhotos(taskId);
        await db.collection("tasks").doc(taskId).update({date:tdy});
        task.date=tdy;
      }

      lblTask.textContent=task.name;
      lblAC.textContent=task.ac||DEFAULT_AC;
      lblDate.textContent=task.date||tdy;

      pageHome.classList.add("d-none");
      pageGrid.classList.remove("d-none");
      fab.classList.remove("d-none");

      await buildGrid({});

      if(unsubPhotos) unsubPhotos();
      unsubPhotos = db.collection("tasks").doc(taskId).collection("photos")
        .onSnapshot(async (snap)=>{
          const map={};
          snap.forEach(d=>map[d.id]=d.data().url);
          await buildGrid(map);
        });
    }

    // =========================
    // HOME LIST realtime
    // =========================
    db.collection("tasks").orderBy("createdAt","desc").onSnapshot((snap)=>{
      const tasks=[];
      snap.forEach(d=>tasks.push({id:d.id,...d.data()}));

      taskList.innerHTML="";
      if(tasks.length===0){
        taskList.innerHTML=`<div class="text-muted fw-bold">Belum ada tugas. Klik + Tambah Tugas Baru.</div>`;
        return;
      }

      tasks.forEach(t=>{
        const el=document.createElement("div");
        el.className="card border-dark rounded-4";
        el.innerHTML=`
          <div class="card-body py-3 d-flex align-items-center justify-content-between gap-2 flex-wrap">
            <div>
              <div class="fw-bold fs-5">${t.name}</div>
              <div class="text-muted fw-semibold" style="font-size:12px;">ID: ${t.id}</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-dark fw-bold rounded-3" data-open="${t.id}">Buka</button>
              <button class="btn btn-outline-danger fw-bold rounded-3" data-del="${t.id}">Hapus</button>
            </div>
          </div>
        `;
        taskList.appendChild(el);
      });

      taskList.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTask(b.getAttribute("data-open")));
      taskList.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ()=>{
        const id=b.getAttribute("data-del");
        if(!confirm("Hapus tugas ini?")) return;
        await db.collection("tasks").doc(id).delete();
      });
    });

    // =========================
    // ADD TASK
    // =========================
    btnAddTask.onclick=()=>{
      addTaskForm.classList.remove("d-none");
      inpTaskName.value="";
      inpTaskName.focus();
    };
    btnCancelTask.onclick=()=>addTaskForm.classList.add("d-none");

    btnSaveTask.onclick=async ()=>{
      const name=inpTaskName.value.trim();
      if(!name) return alert("Nama tugas wajib diisi");

      await db.collection("tasks").add({
        name,
        ac: DEFAULT_AC,
        date: today(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      addTaskForm.classList.add("d-none");
    };

    // =========================
    // BACK
    // =========================
    btnBack.onclick=()=>{
      if(unsubPhotos) unsubPhotos();
      unsubPhotos=null;
      currentTaskId=null;
      currentStoreCode=null;

      pageGrid.classList.add("d-none");
      pageHome.classList.remove("d-none");
      fab.classList.add("d-none");
    };

    // =========================
    // UPLOAD
    // =========================
    filePicker.onchange = async (e)=>{
      const file=e.target.files && e.target.files[0];
      if(!file||!currentTaskId||!currentStoreCode) return;

      const ref=storage.ref(`photos/${currentTaskId}/${currentStoreCode}.jpg`);
      await ref.put(file);

      const url=await ref.getDownloadURL();

      // cache local for capture
      try{
        const blob = new Blob([file], { type: file.type || "image/jpeg" });
        await idbSet(cacheKey(currentTaskId, currentStoreCode), blob);
      }catch(e){}

      await db.collection("tasks").doc(currentTaskId).collection("photos")
        .doc(currentStoreCode)
        .set({ url, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },{merge:true});

      alert("Upload OK ✅");
    };

    // =========================
    // RESET BTN
    // =========================
    btnReset.onclick=async ()=>{
      if(!currentTaskId) return;

      const u=prompt("Reset Authorization\nUsername:");
      if(u===null) return;
      const p=prompt("Password:");
      if(p===null) return;

      if(u!==RESET_USER||p!==RESET_PASS) return alert("Akses ditolak ❌");
      if(!confirm("RESET akan menghapus semua foto pada tugas ini. Lanjut?")) return;

      await resetTaskPhotos(currentTaskId);
      alert("Reset sukses ✅");
    };

    // =========================
    // SEND WA IMAGE (ANTI BLANK 100%)
    // =========================
    btnSendWA.onclick = async ()=>{
      try{
        btnSendWA.disabled=true;
        btnSendWA.textContent="Processing...";

        // 1) ensure cache from storage getBlob (no cors)
        if(currentTaskId){
          for(const s of STORES){
            const key=cacheKey(currentTaskId, s.code);
            const cached=await idbGet(key);
            if(!cached){
              try{
                const blob=await storageGetBlob(currentTaskId, s.code);
                await idbSet(key, blob);
              }catch(e){}
            }
          }
        }

        // 2) rebuild grid pakai data firestore terbaru
        const snap = await db.collection("tasks").doc(currentTaskId).collection("photos").get();
        const map = {};
        snap.forEach(d=>map[d.id]=d.data().url);
        await buildGrid(map);

        // 3) wait all images ready+decode
        await waitImagesReady(reportArea);

        // 4) hide floating (biar tidak ikut)
        fab.classList.add("d-none");
        await new Promise(r=>setTimeout(r,250));

        // 5) capture
        const canvas = await html2canvas(reportArea,{
          scale:2,
          backgroundColor:"#ffffff",
          useCORS:false,
          allowTaint:true,
          logging:false
        });

        fab.classList.remove("d-none");

        // 6) download (share WA lewat galeri)
        const a=document.createElement("a");
        a.href=canvas.toDataURL("image/png");
        a.download=`photo-implementasi-${today().replaceAll('/','-')}.png`;
        a.click();

        alert("✅ Gambar sudah di-download.\nBuka Download lalu Share ke WhatsApp.");
      }catch(e){
        console.error(e);
        fab.classList.remove("d-none");
        alert("Gagal buat image ❌");
      }finally{
        btnSendWA.disabled=false;
        btnSendWA.textContent="Send WA (Image)";
      }
    };
  </script>
</body>
</html>
